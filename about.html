<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>حول تطبيق TRUST IN MED — المؤسس والمطور: محمد صادق منيف</title>
  <meta name="theme-color" content="#6366F1" />
  <style>
    :root {
      --indigo: #6366F1;
      --indigo-dark: #4F46E5;
      --indigo-light: #818CF8;
      --indigo-soft: #EEF2FF;
      --indigo-border: #C7D2FE;
      --text-dark: #0F172A;
      --text-muted: #475569;
      --white: #FFFFFF;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: var(--text-dark);
      background:
        radial-gradient(circle at 12% 10%, rgba(255, 255, 255, 0.34), transparent 38%),
        radial-gradient(circle at 88% 16%, rgba(255, 228, 230, 0.42), transparent 42%),
        linear-gradient(155deg, #F87171 0%, #FB7185 45%, #F43F5E 100%);
      background-attachment: fixed;
      line-height: 1.65;
    }
    a { text-decoration: none; color: inherit; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    code {
      background: #F1F5F9;
      color: #4338CA;
      padding: 2px 6px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.9em;
    }

    /* TOP LIGHT INDIGO HEADER */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: linear-gradient(135deg, #6366F1 0%, #818CF8 100%);
      color: #FFFFFF;
      border-bottom: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 4px 18px rgba(79, 70, 229, 0.25);
    }
    .header-inner {
      max-width: 1080px;
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .logos-pair {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .logo-img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      background: #FFFFFF;
      padding: 2px;
      border: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.14);
    }
    .brand-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .brand-title {
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.2px;
    }
    .brand-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .brand-sub {
      font-size: 12px;
      color: #EEF2FF;
      font-weight: 600;
      margin-top: 2px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-hdr-ghost {
      padding: 7px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #FFFFFF;
      font-size: 12px;
      font-weight: 700;
      transition: background 0.2s;
    }
    .btn-hdr-ghost:hover { background: rgba(255, 255, 255, 0.28); }
    .btn-hdr-white {
      padding: 7px 14px;
      border-radius: 12px;
      background: #FFFFFF;
      color: #4F46E5;
      font-size: 12px;
      font-weight: 800;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      transition: background 0.2s;
    }
    .btn-hdr-white:hover { background: #EEF2FF; }

    /* MAIN CONTAINER */
    .main-wrap {
      flex: 1;
      width: 100%;
      max-width: 1080px;
      margin: 0 auto;
      padding: 20px 16px 32px;
    }

    /* LAYERED BACK BAR */
    .layered-bar {
      background: rgba(255, 255, 255, 0.96);
      border: 1.5px solid var(--indigo-border);
      border-radius: 16px;
      padding: 10px 14px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
    }
    .layered-bar.hidden { display: none; }
    .btn-back {
      background: var(--indigo);
      color: #FFFFFF;
      padding: 7px 14px;
      border-radius: 11px;
      font-size: 12.5px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn-back:hover { background: var(--indigo-dark); }
    .crumb-trail {
      font-size: 12.5px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .depth-badge {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--indigo-soft);
      color: var(--indigo-dark);
      border: 1px solid var(--indigo-border);
    }

    /* ANIMATIONS */
    @keyframes slideForward {
      from { opacity: 0; transform: translateX(-24px) scale(0.99); }
      to { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes slideBack {
      from { opacity: 0; transform: translateX(24px) scale(0.99); }
      to { opacity: 1; transform: translateX(0) scale(1); }
    }
    .enter-forward { animation: slideForward 0.28s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .enter-back { animation: slideBack 0.25s cubic-bezier(0.22, 1, 0.36, 1) both; }

    /* HERO CARD */
    .hero-card {
      background: linear-gradient(135deg, #6366F1 0%, #818CF8 100%);
      color: #FFFFFF;
      border-radius: 24px;
      padding: 28px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow: 0 14px 32px rgba(79, 70, 229, 0.25);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .hero-text { flex: 1 1 420px; }
    .hero-pill {
      display: inline-block;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      margin-bottom: 10px;
    }
    .hero-title {
      font-size: 26px;
      font-weight: 900;
      line-height: 1.35;
      margin-bottom: 10px;
    }
    .hero-desc {
      font-size: 14px;
      color: #EEF2FF;
      line-height: 1.75;
    }
    .hero-stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(115px, 1fr));
      gap: 10px;
      flex-shrink: 0;
    }
    .stat-box {
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 16px;
      padding: 12px 14px;
      text-align: center;
    }
    .stat-num { font-size: 22px; font-weight: 900; }
    .stat-lbl { font-size: 11.5px; color: #EEF2FF; font-weight: 700; }

    /* SECTION HEADING */
    .section-heading {
      color: #FFFFFF;
      font-size: 17px;
      font-weight: 900;
      margin-bottom: 14px;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.15);
    }

    /* LAYERED CARDS GRID */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-bottom: 28px;
    }
    @media (max-width: 720px) {
      .cards-grid { grid-template-columns: 1fr; }
      .hero-title { font-size: 21px; }
      .hero-stats { width: 100%; }
    }
    .layered-card {
      background: #FFFFFF;
      border-radius: 20px;
      padding: 20px;
      border: 2px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.1);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      text-align: right;
      width: 100%;
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
    }
    .layered-card:hover {
      transform: translateY(-3px);
      border-color: var(--indigo-light);
      box-shadow: 0 16px 32px rgba(79, 70, 229, 0.2);
    }
    .card-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    .b-indigo { background: #EEF2FF; color: #4338CA; }
    .b-rose { background: #FFF1F2; color: #BE123C; }
    .b-emerald { background: #ECFDF5; color: #047857; }
    .b-amber { background: #FFFBEB; color: #B45309; }
    .b-slate { background: #F1F5F9; color: #334155; }
    .card-title { font-size: 16px; font-weight: 900; color: #0F172A; margin-bottom: 5px; }
    .card-desc { font-size: 12.5px; color: #475569; line-height: 1.65; }
    .card-arrow {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--indigo-soft);
      color: var(--indigo-dark);
      font-size: 16px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 4px;
    }

    /* PURE WHITE FOUNDER CARD (AT THE VERY BOTTOM — ZERO BLUE BACKGROUND!) */
    .founder-card {
      background: #FFFFFF;
      color: #0F172A;
      border-radius: 26px;
      padding: 28px;
      border: 2px solid var(--indigo-border);
      box-shadow: 0 16px 38px rgba(15, 23, 42, 0.14);
      display: flex;
      align-items: center;
      gap: 24px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .founder-photo-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      background: #FFFFFF;
      padding: 12px;
      border-radius: 20px;
      border: 1px solid #E2E8F0;
      flex-shrink: 0;
    }
    .founder-avatar-img {
      width: 124px;
      height: 124px;
      border-radius: 50%;
      object-fit: cover;
      background: #FFFFFF;
      border: 4px solid var(--indigo-soft);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
    }
    .founder-avatar-empty {
      width: 124px;
      height: 124px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 3px dashed var(--indigo-light);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--indigo);
    }
    .founder-info { flex: 1 1 360px; }
    .founder-name { font-size: 26px; font-weight: 900; color: #0F172A; margin: 6px 0 4px; }
    .founder-role { font-size: 14px; font-weight: 800; color: var(--indigo-dark); margin-bottom: 10px; }
    .founder-bio { font-size: 13.5px; color: #475569; line-height: 1.75; margin-bottom: 14px; }
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 18px;
      border-radius: 12px;
      background: var(--indigo);
      color: #FFFFFF;
      font-size: 12.5px;
      font-weight: 800;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: var(--indigo-dark); }
    .btn-soft {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 12px;
      background: #F8FAFC;
      border: 1px solid #CBD5E1;
      color: #334155;
      font-size: 12px;
      font-weight: 700;
    }
    .btn-danger-soft {
      padding: 8px 12px;
      border-radius: 11px;
      background: #FFF1F2;
      color: #BE123C;
      border: 1px solid #FECDD3;
      font-size: 12px;
      font-weight: 700;
    }

    /* SUBPAGE ARTICLE */
    .subpage-card {
      background: #FFFFFF;
      border-radius: 24px;
      padding: 28px;
      border: 1px solid #E2E8F0;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.1);
    }
    .subpage-title { font-size: 22px; font-weight: 900; color: #0F172A; margin: 10px 0 12px; }
    .subpage-lead { font-size: 14px; color: #475569; margin-bottom: 20px; line-height: 1.75; }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .info-box {
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      padding: 16px;
    }
    .info-box h3 { font-size: 14.5px; font-weight: 800; color: #4338CA; margin-bottom: 6px; }
    .info-box p, .info-box li { font-size: 12.5px; color: #475569; line-height: 1.65; }
    .info-box ul { padding-right: 18px; margin-top: 6px; }
    .step-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: #F8FAFC;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .step-num {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--indigo);
      color: #FFFFFF;
      font-weight: 900;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .inp-field {
      width: 100%;
      padding: 9px 12px;
      border-radius: 11px;
      border: 1.5px solid #CBD5E1;
      font-size: 12.5px;
      background: #FFFFFF;
      color: #0F172A;
      outline: none;
    }
    .inp-field:focus { border-color: var(--indigo); }

    /* FOOTER */
    .bottom-footer {
      background: linear-gradient(135deg, #6366F1 0%, #818CF8 100%);
      color: #FFFFFF;
      text-align: center;
      padding: 11px 16px;
      font-size: 12px;
      font-weight: 800;
      border-top: 1px solid rgba(255, 255, 255, 0.25);
    }

    /* TOAST */
    .toast-box {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      opacity: 0;
      pointer-events: none;
      background: #0F172A;
      color: #FFFFFF;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
      transition: all 0.25s ease;
      z-index: 90;
    }
    .toast-box.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>

  <div id="toast-box" class="toast-box"></div>

  <script>
    const FOUNDER_PHOTO_KEY = "tim_founder_photo_v1";
    const PAGE_TITLES = {
      hub: "حول التطبيق والمؤسس",
      overview: "عن المنصة ورؤيتها الأكاديمية",
      audience: "الفئات المستهدفة ونظام الصلاحيات",
      guide: "دليل الاستخدام الكامل خطوة بخطوة",
      tech: "المزايا التقنية، الأوفلاين، ونسخة APK",
      deploy: "مركز الربط والنشر السريع (GitHub • Vercel • Supabase • Netlify)",
      faq: "الأسئلة الشائعة والدعم الفني"
    };

    const state = { currentPage: "hub", stack: [], direction: "forward" };
    let toastTimer = null;

    function showToast(msg) {
      const el = document.getElementById("toast-box");
      if (!el) return;
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 3200);
    }

    function escapeHtml(str) {
      return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function getFounderPhoto() {
      try { return localStorage.getItem(FOUNDER_PHOTO_KEY) || ""; } catch (e) { return ""; }
    }

    function navigateTo(pageId) {
      if (state.currentPage === pageId) return;
      state.stack.push(state.currentPage);
      state.direction = "forward";
      state.currentPage = pageId;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function navigateBack() {
      state.currentPage = state.stack.length ? state.stack.pop() : "hub";
      state.direction = "back";
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderLayeredBar() {
      const bar = document.getElementById("layered-nav-bar");
      if (!bar) return;
      if (state.currentPage === "hub" && !state.stack.length) {
        bar.classList.add("hidden");
        bar.innerHTML = "";
        return;
      }
      const prevId = state.stack.length ? state.stack[state.stack.length - 1] : "hub";
      bar.classList.remove("hidden");
      bar.innerHTML = `
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <button id="btn-nav-back" type="button" class="btn-back"><span>→</span><span>رجوع إلى: ${escapeHtml(PAGE_TITLES[prevId] || "الرئيسية")}</span></button>
          <div class="crumb-trail">
            <button type="button" id="btn-crumb-hub" style="font-weight:700;color:#475569;">حول التطبيق</button>
            <span>‹</span>
            <strong style="color:#4338CA;">${escapeHtml(PAGE_TITLES[state.currentPage] || "")}</strong>
          </div>
        </div>
        <span class="depth-badge">صفحة ${state.stack.length + 1}</span>
      `;
      document.getElementById("btn-nav-back").addEventListener("click", navigateBack);
      document.getElementById("btn-crumb-hub").addEventListener("click", () => {
        state.stack = [];
        state.direction = "back";
        state.currentPage = "hub";
        render();
      });
    }

    function renderHub() {
      const photo = getFounderPhoto();
      const avatarHtml = photo
        ? `<img src="${photo}" alt="محمد صادق منيف" class="founder-avatar-img" />`
        : `<div class="founder-avatar-empty"><span style="font-size:38px;font-weight:900;">م</span><span style="font-size:11px;color:#64748B;font-weight:700;">أضف صورتك هنا</span></div>`;

      return `
        <div>
          <section class="hero-card">
            <div class="hero-text">
              <span class="hero-pill">✨ الدليل الشامل لمنصة TRUST IN MED — الدفعة 11 طب بشري</span>

    function downloadText(filename, content, mime) {
      const b = new Blob([content], { type: mime || "text/plain;charset=utf-8" });
      const u = URL.createObjectURL(b);
      const a = document.createElement("a");
      a.href = u; a.download = filename;
      document.body.appendChild(a); a.click();
      setTimeout(() => { try { document.body.removeChild(a); URL.revokeObjectURL(u); } catch (e) {} }, 350);
    }

    function bindEvents() {
      document.querySelectorAll("[data-go]").forEach(btn => {
        btn.addEventListener("click", () => navigateTo(btn.getAttribute("data-go")));
      });
      const uploadBtn = document.getElementById("founder-photo-upload-btn");
      const fileInp = document.getElementById("founder-photo-input");
      const removeBtn = document.getElementById("founder-photo-remove-btn");
      if (uploadBtn && fileInp) {
        uploadBtn.addEventListener("click", () => fileInp.click());
        fileInp.addEventListener("change", (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            const img = new Image();
            img.onload = () => {
              const size = 400;
              const c = document.createElement("canvas");
              c.width = size; c.height = size;
              const ctx = c.getContext("2d");
              ctx.fillStyle = "#FFFFFF";
              ctx.fillRect(0, 0, size, size);
              const m = Math.min(img.width, img.height);
              ctx.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, size, size);
              try {
                localStorage.setItem(FOUNDER_PHOTO_KEY, c.toDataURL("image/jpeg", 0.9));
                showToast("✓ تم حفظ صورتك الشخصية بنجاح بخلفية بيضاء");
                render();
              } catch (err) { showToast("تعذر حفظ الصورة محلياً."); }
            };
            img.src = reader.result;
          };
          reader.readAsDataURL(file);
        });
      }
      if (removeBtn) removeBtn.addEventListener("click", () => {
        try { localStorage.removeItem(FOUNDER_PHOTO_KEY); } catch (e) {}
        showToast("تمت إزالة الصورة الشخصية.");
        render();
      });

      const repoInp = document.getElementById("deploy-repo-input");
      const btnSaveRepo = document.getElementById("btn-save-repo");
      if (btnSaveRepo && repoInp) btnSaveRepo.addEventListener("click", () => {
        try { localStorage.setItem("tim_deploy_repo_url", repoInp.value.trim()); } catch (e) {}
        showToast("✓ تم حفظ رابط مستودع GitHub");
      });
      const btnGh = document.getElementById("btn-go-github");
      if (btnGh) btnGh.addEventListener("click", () => {
        const r = (repoInp && repoInp.value.trim()) || localStorage.getItem("tim_deploy_repo_url") || "";
        window.open(r || "https://github.com/new?name=trust-in-med&description=TRUST+IN+MED+Academic+Platform", "_blank", "noopener,noreferrer");
      });
      const btnVercel = document.getElementById("btn-go-vercel");
      if (btnVercel) btnVercel.addEventListener("click", () => {
        const r = (repoInp && repoInp.value.trim()) || localStorage.getItem("tim_deploy_repo_url") || "";
        window.open(r ? "https://vercel.com/new/clone?repository-url=" + encodeURIComponent(r) : "https://vercel.com/new", "_blank", "noopener,noreferrer");
      });
      const btnDlVercel = document.getElementById("btn-dl-vercel");
      if (btnDlVercel) btnDlVercel.addEventListener("click", () => {
        downloadText("vercel.json", JSON.stringify({ cleanUrls: true, rewrites: [{ source: "/(.*)", destination: "/index.html" }] }, null, 2), "application/json");
        showToast("✓ تم تنزيل vercel.json");
      });
      const btnSb = document.getElementById("btn-go-supabase");
      if (btnSb) btnSb.addEventListener("click", () => {
        const sql = "-- TRUST IN MED Supabase Schema\ncreate table if not exists public.tim_sync_state (\n  id text primary key,\n  payload jsonb not null,\n  updated_at timestamptz default now()\n);\nalter table public.tim_sync_state enable row level security;\ncreate policy \"Allow read\" on public.tim_sync_state for select using (true);\ncreate policy \"Allow write\" on public.tim_sync_state for all using (true);\n";
        try { navigator.clipboard.writeText(sql); } catch (e) {}
        showToast("✓ تم نسخ كود SQL وفتح Supabase");
        window.open("https://supabase.com/dashboard/projects", "_blank", "noopener,noreferrer");
      });
      const btnSaveSb = document.getElementById("btn-save-sb");
      if (btnSaveSb) btnSaveSb.addEventListener("click", () => {
        try {
          localStorage.setItem("tim_supabase_url", (document.getElementById("sb-url-inp") || {}).value.trim());
          localStorage.setItem("tim_supabase_anon_key", (document.getElementById("sb-key-inp") || {}).value.trim());
          showToast("✓ تم حفظ مفاتيح ربط Supabase");
        } catch (e) {}
      });
      const btnNl = document.getElementById("btn-go-netlify");
      if (btnNl) btnNl.addEventListener("click", () => {
        const r = (repoInp && repoInp.value.trim()) || localStorage.getItem("tim_deploy_repo_url") || "";
        window.open(r ? "https://app.netlify.com/start/deploy?repository=" + encodeURIComponent(r) : "https://app.netlify.com/drop", "_blank", "noopener,noreferrer");
      });
      const btnDlNl = document.getElementById("btn-dl-netlify");
      if (btnDlNl) btnDlNl.addEventListener("click", () => {
        downloadText("netlify.toml", '[build]\n  publish = "."\n\n[[redirects]]\n  from = "/*"\n  to = "/index.html"\n  status = 200\n', "text/plain");
        showToast("✓ تم تنزيل netlify.toml");
      });
    }

    function render() {
      renderLayeredBar();
      const root = document.getElementById("page-root");
      if (state.currentPage === "hub") root.innerHTML = renderHub();
      else if (state.currentPage === "overview") root.innerHTML = renderOverview();
      else if (state.currentPage === "audience") root.innerHTML = renderAudience();
      else if (state.currentPage === "guide") root.innerHTML = renderGuide();
      else if (state.currentPage === "tech") root.innerHTML = renderTech();
      else if (state.currentPage === "deploy") root.innerHTML = renderDeploy();
      else if (state.currentPage === "faq") root.innerHTML = renderFaq();

      root.classList.remove("enter-forward", "enter-back");
      void root.offsetWidth;
      root.classList.add(state.direction === "back" ? "enter-back" : "enter-forward");
      bindEvents();
    }

    document.getElementById("hdr-home-btn").addEventListener("click", () => {
      state.stack = [];
      state.direction = "back";
      state.currentPage = "hub";
      render();
    });

    render();
  </script>
</body>
</html>
